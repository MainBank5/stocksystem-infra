replicaCount: 2

image:
  repository: 996549485813.dkr.ecr.us-east-1.amazonaws.com/payment-service
  pullPolicy: IfNotPresent
  tag: "" # Managed by GitHub Actions

service:
  type: ClusterIP
  port: 3000

# Service-Specific Connections
env:
  - name: DB_HOST
    value: "payment-db-service"
  - name: RABBITMQ_URL
    value: "amqp://rabbitmq:5672"
  - name: STRIPE_API_VERSION
    value: "2023-10-16"

# Sensitive Credentials (API Keys, DB Passwords)
envFrom:
  - secretRef:
      name: payment-service-secrets

resources:
  limits:
    cpu: 300m
    memory: 512Mi
  requests:
    cpu: 150m
    memory: 256Mi

# Prevent Nil Pointer Errors
ingress:
  enabled: false
