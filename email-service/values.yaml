replicaCount: 1 # Email workers usually don't need high replicas unless volume is massive

image:
  repository: 996549485813.dkr.ecr.us-east-1.amazonaws.com/email-service
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 3000

# Environment Variables
env:
  - name: RABBITMQ_URL
    value: "amqp://rabbitmq:5672"
  - name: EMAIL_FROM
    value: "noreply@stocksystem.com"
  - name: SMTP_HOST
    value: "smtp.mailtrap.io"

# Sensitive SMTP User/Pass
envFrom:
  - secretRef:
      name: email-service-secrets

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

ingress:
  enabled: false
