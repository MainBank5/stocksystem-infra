# Default values for api-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 2

image:
  repository: 996549485813.dkr.ecr.us-east-1.amazonaws.com/api-gateway
  pullPolicy: IfNotPresent
  tag: "" # Overridden by GitHub Actions

service:
  port: 3000

# Pass variables your NestJS code expects:
env:
  - name: AUTH_HOST
    value: "auth-service"
  - name: RABBITMQ_URL
    value: "amqp://user:pass@rabbitmq:5672"

# If you have a Kubernetes Secret for DB passwords:
envFrom:
  - secretRef:
      name: api-gateway-secrets

      # Standard Probe (Make sure your app has a /health route):TOdo
livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http
